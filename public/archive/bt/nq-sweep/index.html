<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Backtest Viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--card:#fffdf8;--bg:#f6f4ef;--panel:#fffdf8;--ink:#1b2733;--muted:#5f6b78;--line:#d9d4c7;--up:#1e8f6e;--down:#c23b4b;--lvl:#b8860b;--accent:#1f5f8b;--grid:#ebe7dc;--sel:#fff3c4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--panel:#000;--ink:#d1d4dc;--muted:#787b86;--line:#1f1f1f;--up:#26a69a;--down:#ef5350;--lvl:#f0b90b;--accent:#5aa0d8;--grid:#131313;--sel:#1c1f26;--card:#0b0b0b}}
:root[data-theme="dark"]{--bg:#000;--panel:#000;--ink:#d1d4dc;--muted:#787b86;--line:#1f1f1f;--up:#26a69a;--down:#ef5350;--lvl:#f0b90b;--accent:#5aa0d8;--grid:#131313;--sel:#1c1f26;--card:#0b0b0b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;padding-inline:12px;padding-block:8px 16px}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-size:18px;font-weight:600;margin:0}.sub{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
select,button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
button{cursor:pointer}button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
label.ck{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12px}
.chip b{font-weight:500;color:var(--muted);margin-right:4px}
#stage{display:flex;height:64vh;min-height:380px;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
#stage.fs{position:fixed;inset:0;height:100vh;z-index:50;border:0;border-radius:0}
#stage:fullscreen{height:100vh;border:0;border-radius:0}
#main{position:relative;flex:1;min-width:0;height:auto}
#tools{display:flex;flex-direction:column;width:48px;flex:none;border-right:1px solid var(--line);padding:4px 0;gap:1px;align-items:center;overflow:auto;background:var(--card)}
#tools button{width:42px;height:38px;padding:0;border:0;background:transparent;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--ink);line-height:1}
#tools button .g{font-size:15px}#tools button .n{font-size:9px;color:var(--muted);margin-top:2px}
#tools button:hover{background:var(--grid)}#tools button[aria-pressed=true]{background:var(--sel);color:var(--accent)}#tools button[aria-pressed=true] .n{color:var(--accent)}
#tools .sep{width:28px;border-top:1px solid var(--line);margin:3px 0}#tools .sp{flex:1}
#tools input[type=checkbox]{display:none}
#dstat{position:absolute;left:10px;bottom:30px;z-index:5;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--panel) 75%,transparent);padding:1px 6px;border-radius:3px;pointer-events:none}
.props[hidden],#draw[hidden]{display:none}
#ohlc{top:28px}#ohlc b{font-weight:500;color:var(--muted);margin:0 2px 0 8px}#ohlc b:first-child{margin-left:0}
.props{position:absolute;left:10px;top:50px;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:4px;padding:6px 8px;max-width:calc(100% - 80px)}
#eq{position:relative;height:160px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.legend{position:absolute;left:10px;top:8px;z-index:5;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;pointer-events:none;background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 6px;border-radius:3px}
.tbl{overflow:auto;max-height:320px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:500}
td:first-child,th:first-child{text-align:left}tr{cursor:pointer}tr:hover{background:var(--grid)}tr.sel{background:var(--sel)}
.pos{color:var(--up)}.neg{color:var(--down)}
.note{font-size:12px;color:var(--muted);line-height:1.5;max-width:100ch;margin:0}
#main.drawing{cursor:crosshair}
.props input[type=text]{font:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.props input[type=number]{font:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
#pnote{min-width:min(420px,70vw)}
@media (max-width:600px){#stage{height:60vh;min-height:320px}#eq{height:120px}#tools{width:40px}#tools button{width:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Backtest Viewer</h1><span class="sub" id="sub">載入中…</span></header>
  <div class="bar">
    <select id="sym" aria-label="商品"></select>
    <select id="grid" aria-label="停損格"></select>
    <select id="acc" aria-label="成交棒算法"><option value="cons">保守（成交棒內逆向超過停損＝被打到）</option><option value="opt">樂觀（成交棒不查）</option></select>
    <select id="sess" aria-label="時段"><option value="">全部時段</option><option value="EU">歐盤 03–09:30 ET</option><option value="US">美盤 09:30–16</option><option value="ASIA">亞洲 18–03</option></select>
    <select id="dir" aria-label="方向"><option value="">多空都看</option><option value="1">只看多單</option><option value="-1">只看空單</option></select>
    <label class="ck"><input type="checkbox" id="roll"> 含換月週（±5 天）</label>
    <label class="ck"><input type="checkbox" id="noamb"> 排除棒內分不出先後的單</label>
    <span class="bar" id="lv"></span>
    <span class="bar" id="draw" hidden>
      <select id="dmode" aria-label="畫哪些筆的結構"><option value="none">不畫程式的結構</option><option value="sel">只畫選中那筆</option><option value="all">畫全部</option></select>
      <label class="ck"><input type="checkbox" id="d_mark" checked> 程式進場箭頭</label>
      <label class="ck"><input type="checkbox" id="d_sess" checked> 時段框</label>
      <label class="ck"><input type="checkbox" id="d_vp" checked> 固定成交量</label>
      <label class="ck"><input type="checkbox" id="d_fvg" checked> FVG</label>
      <label class="ck"><input type="checkbox" id="d_liq" checked> 流動性線</label>
      <label class="ck"><input type="checkbox" id="d_pos" checked> 部位框</label>
      <label class="ck"><input type="checkbox" id="d_vol" checked> 成交量</label>
    </span>
    <span class="bar" id="per"><button type="button" data-days="3">3 天</button><button type="button" data-days="30">30 天</button><button type="button" data-days="90" aria-pressed="true">90 天</button><button type="button" data-days="365">1 年</button><button type="button" data-days="0">全部</button></span>
  </div>
  <div class="chips" id="chips"></div>
  <div id="stage">
    <div id="tools">
      <button type="button" data-tool="sel" aria-pressed="true" title="選取／拖動（Esc）"><span class="g">↖</span><span class="n">選取</span></button>
      <button type="button" data-tool="liq_b" title="買方流動性 Buyside（L）：點高點、拖到被掃的地方；磁吸只吸 High"><span class="g">▔</span><span class="n">買方流動</span></button>
      <button type="button" data-tool="liq_s" title="賣方流動性 Sellside（Shift+L）：點低點、拖到被掃的地方；磁吸只吸 Low"><span class="g">▁</span><span class="n">賣方流動</span></button>
      <button type="button" data-tool="vp" title="固定成交量（V）：拖一段時間，價格範圍與直方圖自動算"><span class="g">▥</span><span class="n">成交量</span></button>
      <button type="button" data-tool="fvg" title="FVG（F）：拖出缺口的框"><span class="g">▦</span><span class="n">FVG</span></button>
      <button type="button" data-tool="ifvg" title="IFVG（I）：翻轉後的缺口，拖出框"><span class="g" style="color:#4db6ac">▩</span><span class="n">IFVG</span></button>
      <button type="button" data-tool="box" title="區域（B）"><span class="g">▢</span><span class="n">區域</span></button>
      <button type="button" data-tool="pos_l" title="多單（G）：點進場價、往下拖到停損；目標預設 2R，面板可改"><span class="g" style="color:var(--up)">▲</span><span class="n">多單</span></button>
      <button type="button" data-tool="pos_s" title="空單（S）：點進場價、往上拖到停損"><span class="g" style="color:var(--down)">▼</span><span class="n">空單</span></button>
      <button type="button" data-tool="tline" title="趨勢線（T）"><span class="g">╱</span><span class="n">趨勢</span></button>
      <button type="button" data-tool="text" title="文字（N）：點一下、打字"><span class="g">T</span><span class="n">文字</span></button>
      <div class="sep"></div>
      <button type="button" id="b_magnet" aria-pressed="true" title="磁吸：靠近 O/H/L/C 就吸上去"><span class="g">🧲</span><span class="n">磁吸</span></button>
      <button type="button" id="b_stay" aria-pressed="false" title="連續畫：畫完不跳回選取"><span class="g">∞</span><span class="n">連續</span></button>
      <button type="button" id="b_show" aria-pressed="true" title="顯示／隱藏我畫的圖"><span class="g">👁</span><span class="n">我的圖</span></button>
      <input type="checkbox" id="magnet" checked><input type="checkbox" id="stay"><input type="checkbox" id="ud_show" checked>
      <div class="sep"></div>
      <button type="button" id="b_undo" title="回上一動（Ctrl+Z）"><span class="g">↶</span><span class="n">上一動</span></button>
      <button type="button" id="b_redo" title="重做（Ctrl+Y 或 Ctrl+Shift+Z）"><span class="g">↷</span><span class="n">重做</span></button>
      <div class="sp"></div>
      <button type="button" id="b_prev" title="上一筆進場（←）"><span class="g">◀</span><span class="n">上一筆</span></button>
      <button type="button" id="b_next" title="下一筆進場（→）"><span class="g">▶</span><span class="n">下一筆</span></button>
      <button type="button" id="fsbtn" title="全螢幕（Shift+F；Esc 離開）"><span class="g">⛶</span><span class="n">全螢幕</span></button>
    </div>
    <div id="main">
      <div class="legend" id="legend">◆ 掃單棒　▼▲ 進場（在價位）　■ 出場（標點數；灰色＝棒內分不出先後）　── 選中那筆的價位／停損</div>
      <div class="legend" id="ohlc"></div>
      <span id="dstat"></span>
      <div class="bar props" id="props" hidden>
        <span class="sub" id="pinfo"></span>
        <select id="pkind" hidden aria-label="種類"></select>
        <input type="text" id="plabel" placeholder="標籤" aria-label="標籤" style="width:150px">
        <input type="text" id="pnote" placeholder="備註：為什麼這樣畫、看到什麼（我會逐字讀）" aria-label="備註">
        <span class="bar" id="pnum"></span>
        <button type="button" id="pdup" title="複製一份往右 6 根">複製</button>
        <button type="button" id="pdel" title="Delete 鍵也可以">刪除</button>
      </div>
    </div>
  </div>
  <div id="eq"><div class="legend">權益曲線（累計點數，依出場時間；1 口）</div></div>
  <div class="tbl"><table id="tbl"><thead><tr><th>成交（台北）</th><th>方向</th><th>價位</th><th>停損</th><th>等待</th><th>標記</th><th>時段</th><th>出場</th><th>點數</th><th>$</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="note"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const TZ = 8 * 3600;                      // 圖軸顯示台北時間：時間戳加 8 小時（lightweight-charts 以 UTC 畫）
let eqHas = false;
let dir = '';
let noAmb = false;
let D, sym, grid, acc = 'cons', sess = '', days = 90, incRoll = false, main, eq, cs, eqS, lines = [], selIdx = -1;
const fmt = (ts) => { const d = new Date((ts) * 1000); return d.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }); };
const fmtY = (ts) => new Date(ts * 1000).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
function mkChart(el, extra) {
  return LightweightCharts.createChart(el, Object.assign({ layout: { background: { type: 'solid', color: css('--panel') }, textColor: css('--ink'), fontFamily: '"IBM Plex Mono", ui-monospace, monospace', fontSize: 11 },
    grid: { vertLines: { color: css('--grid') }, horzLines: { color: css('--grid') } }, rightPriceScale: { borderColor: css('--line') },
    timeScale: { borderColor: css('--line'), timeVisible: true, secondsVisible: false, rightOffset: 6 }, crosshair: { mode: 0, vertLine: { color: '#758696', width: 1, style: 3, labelBackgroundColor: '#2a2e39' }, horzLine: { color: '#758696', width: 1, style: 3, labelBackgroundColor: '#2a2e39' } }, autoSize: true }, extra || {}));
}
// 部位框（10-08 使用者：「看不出 3R 的感覺」）：每筆從進場到出場，綠框＝進場→目標、紅框＝進場→停損；沒有目標的格只畫紅框。
const boxes = { list: [], chart: null, series: null, req: null,
  attached(p) { this.chart = p.chart; this.series = p.series; this.req = p.requestUpdate; }, detached() {}, updateAllViews() {},
  paneViews() { const self = this; return [{ zOrder: () => 'bottom', renderer: () => ({ draw: (target) => target.useBitmapCoordinateSpace(sc => {
    const ctx = sc.context, hr = sc.horizontalPixelRatio, vr = sc.verticalPixelRatio, ts = self.chart.timeScale(), sp = ts.options().barSpacing || 6;
    self.list.forEach(b => {
      if (b.hide) return;
      const x1 = ts.timeToCoordinate(b.t0), x2 = ts.timeToCoordinate(b.t1); if (x1 === null || x2 === null) return;
      const xa = (x1 - sp / 2) * hr, w = Math.max(2, (x2 - x1 + sp)) * hr, ye = self.series.priceToCoordinate(b.e), ys = self.series.priceToCoordinate(b.s);
      if (ye === null || ys === null) return;
      ctx.fillStyle = b.sel ? 'rgba(239,83,80,0.45)' : 'rgba(239,83,80,0.26)'; ctx.fillRect(xa, Math.min(ye, ys) * vr, w, Math.abs(ys - ye) * vr);
      if (b.g != null) { const yg = self.series.priceToCoordinate(b.g); if (yg !== null) { ctx.fillStyle = b.sel ? 'rgba(38,166,154,0.45)' : 'rgba(38,166,154,0.26)'; ctx.fillRect(xa, Math.min(ye, yg) * vr, w, Math.abs(yg - ye) * vr); } }
      ctx.fillStyle = 'rgba(200,200,200,0.7)'; ctx.fillRect(xa, ye * vr - hr / 2, w, Math.max(1, vr));
      if (b.lab) { ctx.font = (10 * vr) + 'px "IBM Plex Mono", monospace'; ctx.textBaseline = 'middle';
        const tag = (y, txt, col) => { const tw = ctx.measureText(txt).width + 8 * hr; ctx.fillStyle = col; ctx.fillRect(xa + w + 2 * hr, y * vr - 7 * vr, tw, 14 * vr); ctx.fillStyle = '#fff'; ctx.fillText(txt, xa + w + 6 * hr, y * vr); };
        tag(ys, (+b.s).toFixed(2), 'rgba(239,83,80,0.95)'); if (b.g != null) { const yg = self.series.priceToCoordinate(b.g); if (yg !== null) tag(yg, (+b.g).toFixed(2), 'rgba(38,166,154,0.95)'); }
        tag(ye, (+b.e).toFixed(2), 'rgba(120,120,130,0.95)'); }
    });
  }) }) }]; },
  set(list) { this.list = list; if (this.req) this.req(); } };
// 流動性線（10-09 使用者：「把現在系統認定的流動性區域用線都標出來」）：syms[SYM].levels = [{t0,t1,p,kind,label}]；每種 kind 一個開關
const LV_COLOR = { '時段高低': '#f0b90b', '15m轉折': '#5aa0d8', '1h轉折': '#b57bee', '使用者線': '#ffffff', '相等高低': '#ff8a65', '15m轉折·弱': '#3d6f93', '1h轉折·弱': '#7a56a3', '時段內15m轉折': '#5aa0d8', '時段內1h轉折': '#b57bee', '被掃的線': '#f0b90b', 'POC': '#ff8a65', '獵取極值': '#e05c5c' };
let lvOn = {};
const levels = { list: [], chart: null, series: null, req: null,
  attached(p) { this.chart = p.chart; this.series = p.series; this.req = p.requestUpdate; }, detached() {}, updateAllViews() {},
  paneViews() { const self = this; return [{ zOrder: () => 'top', renderer: () => ({ draw: (target) => target.useBitmapCoordinateSpace(sc => {
    const ctx = sc.context, hr = sc.horizontalPixelRatio, vr = sc.verticalPixelRatio, ts = self.chart.timeScale();
    const vis = ts.getVisibleRange(); if (!vis) return;
    ctx.font = (10 * vr) + 'px "IBM Plex Mono", monospace'; ctx.textBaseline = 'bottom';
    self.list.forEach(b => {
      if (!lvOn[b.kind] || b.t1 < vis.from || b.t0 > vis.to) return;
      const x1 = ts.timeToCoordinate(Math.max(b.t0, vis.from)), x2 = ts.timeToCoordinate(Math.min(b.t1, vis.to)); if (x1 === null || x2 === null) return;
      const y = self.series.priceToCoordinate(b.p); if (y === null) return;
      const col = LV_COLOR[b.kind] || '#999';
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, vr) * (b.kind === '使用者線' ? 1.5 : 1); ctx.setLineDash(b.kind === '使用者線' ? [6 * hr, 4 * hr] : []);
      ctx.beginPath(); ctx.moveTo(x1 * hr, y * vr); ctx.lineTo(x2 * hr, y * vr); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = col; ctx.fillText(b.label + ' ' + b.p, x1 * hr + 3 * hr, y * vr - 2 * vr);
    });
  }) }) }]; },
  set(list) { this.list = list; if (this.req) this.req(); } };
// 時段框（使用者的 TV 畫法：Tokyo／London／New York 三個時段各一個半透明框，框高＝時段高低，名字在框底）
const SESS_COLOR = { '亞洲': ['rgba(63,81,181,0.22)', '#7986cb', 'Tokyo'], '倫敦': ['rgba(255,152,0,0.18)', '#ffb74d', 'London'], '紐約': ['rgba(156,39,176,0.20)', '#ba68c8', 'New York'] };
function snapT(B, t) { let lo = 0, hi = B.t.length - 1; if (t <= B.t[0]) return B.t[0] + TZ; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (B.t[m] <= t) lo = m; else hi = m - 1; } return B.t[lo] + TZ; }
function xr(ts, B, t0, t1, vis) { const a = Math.max(snapT(B, t0), vis.from), b = Math.min(snapT(B, t1), vis.to); if (a > b) return null; const x1 = ts.timeToCoordinate(a), x2 = ts.timeToCoordinate(b); if (x1 === null || x2 === null) return null; return [x1, x2]; }
const sessBoxes = { list: [], B: null, chart: null, series: null, req: null,
  attached(p) { this.chart = p.chart; this.series = p.series; this.req = p.requestUpdate; }, detached() {}, updateAllViews() {},
  paneViews() { const self = this; return [{ zOrder: () => 'bottom', renderer: () => ({ draw: (target) => target.useBitmapCoordinateSpace(sc => {
    if (!self.B || !document.getElementById('d_sess').checked) return;
    const ctx = sc.context, hr = sc.horizontalPixelRatio, vr = sc.verticalPixelRatio, ts = self.chart.timeScale(), sp = ts.options().barSpacing || 6;
    const vis = ts.getVisibleRange(); if (!vis) return;
    ctx.font = (11 * vr) + 'px "IBM Plex Sans", sans-serif'; ctx.textBaseline = 'top';
    self.list.forEach(b => {
      if (b.t1 + TZ < vis.from || b.t0 + TZ > vis.to) return;
      const r = xr(ts, self.B, b.t0, b.t1, vis); if (!r) return;
      const yh = self.series.priceToCoordinate(b.hi), yl = self.series.priceToCoordinate(b.lo); if (yh === null || yl === null) return;
      const c = SESS_COLOR[b.kind] || ['rgba(120,120,120,0.15)', '#999', b.kind];
